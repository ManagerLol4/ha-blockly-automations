name: Validieren

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # topics: werden in den GitHub-Repo-Einstellungen gesetzt (braucht Admin-Rechte).
          # Sobald dort z. B. home-assistant, hacs, blockly eingetragen sind, "topics" hier entfernen.
          ignore: brands topics
