<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockly Automations</title>
  <script>
    // Alle Dateien mit Versionsnummer laden, damit nach einem Update nie alte Dateien aus dem Browser-Cache kommen.
    window.HAB_V = encodeURIComponent(new URLSearchParams(location.search).get("v") || Date.now());
    document.write('<link rel="stylesheet" href="editor.css?v=' + HAB_V + '">');
    document.write('<script src="vendor/blockly_compressed.js?v=' + HAB_V + '"><\/script>');
    document.write('<script src="vendor/msg_de.js?v=' + HAB_V + '"><\/script>');
    // Blockly-Plugins (Apache-2.0): Suche im Werkzeugkasten, Kopieren zwischen Automationen, Rucksack.
    for (const p of ["toolbox-search", "plugin-cross-tab-copy-paste", "workspace-backpack"])
      document.write('<script src="vendor/plugins/' + p + '.js?v=' + HAB_V + '"><\/script>');
  </script>
</head>
<body>
  <header id="bar">
    <button id="menu" class="icon" title="HA-Seitenleiste">&#9776;</button>
    <button id="toggleList" class="icon" title="Liste der Automationen ein/aus">&#128194;</button>
    <div class="newWrap">
      <button id="new" class="primary" title="Neue Automation anlegen">＋ Neu</button>
      <div id="newMenu" class="menu hidden"></div>
    </div>
    <b id="title" class="title">–</b>
    <label class="cat" title="Kategorie (Ordner) dieser Automation">
      <span>Ordner</span>
      <select id="category"></select>
    </label>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="fitBtn" class="icon" title="Alles zeigen (ganze Automation ins Bild)">&#10530;</button>
    <button id="findBtn" class="icon" title="Im Arbeitsbereich suchen (Strg+F)">&#128270;</button>
    <button id="insBtn" class="icon" title="Abläufe (Traces), Live-Werte und Hinweise">&#128269;</button>
    <button id="xrefBtn" class="icon" title="Querverweise: wer nutzt welche Entität?">&#128279;</button>
    <button id="undo" class="icon" title="Rückgängig (Strg+Z)">&#8630;</button>
    <button id="redo" class="icon" title="Wiederholen (Strg+Y)">&#8631;</button>
    <button id="reload" title="Änderungen verwerfen und neu laden">Verwerfen</button>
    <button id="save" class="primary">Speichern</button>
    <button id="settingsBtn" class="icon" title="Einstellungen">&#9881;</button>
    <button id="expert" class="icon" title="Expertenmodus: Eingabefelder, alle Bausteine, JSON">&#128295;</button>
    <button id="toggleSide" class="expertOnly" title="JSON-Seitenleiste ein/aus">JSON</button>
  </header>
  <main>
    <nav id="list">
      <div class="tabs">
        <button id="tabAuto" class="tab sel" title="Automationen: WENN … DANN …">🤖 Automationen</button>
        <button id="tabScript" class="tab" title="Skripte: wiederverwendbare Abläufe (Funktionen)">📜 Skripte</button>
      </div>
      <div class="listHead">
        <input id="search" type="search" placeholder="Automation suchen …" autocomplete="off">
        <button id="newCat" class="icon" title="Neuen Ordner (Kategorie) anlegen">&#128193;</button>
      </div>
      <div id="tree"></div>
      <div class="listFoot">
        <span>Tipp: mit der Maus in einen anderen Ordner ziehen.</span>
        <button id="selfTestBtn" title="Prüft, ob alle verlustfrei als Bausteine darstellbar sind">🧪 Alle prüfen</button>
      </div>
    </nav>
    <div id="ws">
      <div id="find" class="find hidden">
        <input id="findInput" type="search" placeholder="Baustein suchen … (Enter = nächster)" autocomplete="off">
        <span id="findInfo" class="hint"></span>
        <button id="findClose" class="icon" title="Schließen">✕</button>
      </div>
    </div>
    <aside id="insp" class="hidden">
      <div class="sideHead"><b>Ablauf &amp; Werte</b><button id="inspClose" class="icon" title="Schließen">✕</button></div>
      <div class="ibody">
        <section>
          <h4>Letzte Abläufe (Traces)</h4>
          <div class="row"><select id="runs"></select><button id="runsReload" class="icon" title="Neu laden">⟳</button></div>
          <div id="runInfo" class="hint"></div>
        </section>
        <section>
          <label class="chk"><input type="checkbox" id="live"> Live: Bedingungen jetzt prüfen</label>
          <div class="hint">Gestrichelt grün = wäre jetzt erfüllt, rot = nicht erfüllt.</div>
        </section>
        <section>
          <h4>Ausgewählter Baustein</h4>
          <div id="detail"></div>
          <div id="detailLive"></div>
        </section>
        <section>
          <h4>Hinweise</h4>
          <div id="hints"></div>
        </section>
      </div>
    </aside>
    <aside id="side">
      <div class="sideHead"><b id="sideTitle">Gesamte Automation</b></div>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="sideFoot">
        <button id="applyJson">JSON übernehmen</button>
        <span class="hint">Ohne Auswahl: ganze Automation. Mit Auswahl: nur dieser Block.</span>
      </div>
    </aside>
  </main>
  <div id="ask" class="modal hidden">
    <div class="mbox askBox">
      <div class="mhead"><b id="askTitle"></b></div>
      <div class="askBody">
        <input id="askInput" type="text" autocomplete="off">
        <div id="askHint" class="hint"></div>
        <div class="askFoot"><button id="askCancel">Abbrechen</button><button id="askOk" class="primary">OK</button></div>
      </div>
    </div>
  </div>
  <div id="modal" class="modal hidden">
    <div class="mbox">
      <div class="mhead"><b id="mTitle"></b><span id="mStatus" class="hint"></span><button id="mClose" class="icon" title="Schließen">✕</button></div>
      <div id="mBody"></div>
    </div>
  </div>
  <script>
    document.write('<script src="ha_values.js?v=' + HAB_V + '"><\/script>');
    document.write('<script src="ha_blocks.js?v=' + HAB_V + '"><\/script>');
    document.write('<script src="editor.js?v=' + HAB_V + '"><\/script>');
  </script>
</body>
</html>
