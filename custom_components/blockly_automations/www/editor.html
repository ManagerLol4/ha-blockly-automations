<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockly Automations</title>
  <link rel="stylesheet" href="editor.css">
  <script src="vendor/blockly_compressed.js"></script>
  <script src="vendor/msg_de.js"></script>
</head>
<body>
  <header id="bar">
    <button id="menu" class="icon" title="HA-Seitenleiste">&#9776;</button>
    <button id="toggleList" class="icon" title="Automationsliste ein/aus">&#128194;</button>
    <b id="title" class="title">–</b>
    <label class="cat" title="Kategorie dieser Automation">
      <span>Kategorie</span>
      <select id="category"></select>
    </label>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="reload" title="Aus HA neu laden">Neu laden</button>
    <button id="save" class="primary">Speichern</button>
    <button id="toggleSide" title="JSON-Seitenleiste ein/aus">JSON</button>
  </header>
  <main>
    <nav id="list">
      <div class="listHead">
        <input id="search" type="search" placeholder="Suchen …" autocomplete="off">
        <button id="new" class="icon" title="Neue Automation">＋</button>
        <button id="newCat" class="icon" title="Neue Kategorie (Ordner)">&#128193;</button>
      </div>
      <div id="tree"></div>
      <div class="listFoot">Automationen per Drag &amp; Drop in einen Ordner ziehen, um die Kategorie zu ändern.</div>
    </nav>
    <div id="ws"></div>
    <aside id="side">
      <div class="sideHead"><b id="sideTitle">Gesamte Automation</b></div>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="sideFoot">
        <button id="applyJson">JSON übernehmen</button>
        <span class="hint">Ohne Auswahl: ganze Automation. Mit Auswahl: nur dieser Block.</span>
      </div>
    </aside>
  </main>
  <script src="ha_blocks.js"></script>
  <script src="editor.js"></script>
</body>
</html>
